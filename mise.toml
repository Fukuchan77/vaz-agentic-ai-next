[tools]
node = "24"
pnpm = "12"
# Python package manager for services/agent (py:check / openapi:gen); pinned so
# the local toolchain and CI (.github/workflows/python.yml via mise-action)
# provision the same major/minor.
uv = "0.12"
# Secret scanner (secret-scan tasks, .githooks/pre-commit, security-daily.yml).
# Provisioned here rather than assumed on PATH for the same reason node/pnpm/uv are:
# CI gets it from jdx/mise-action with no extra install step, and a developer's
# `mise install` gets the identical build. Major-pinned so new detection rules land
# on their own — a scanner frozen at a patch version silently stops finding things.
gitleaks = "8"

[hooks]
# git clone → (mise trust &) pnpm install to resolve dependencies (NFR-2 reproducibility).
postinstall = "pnpm install"

# --- Web app (apps/web) tasks: scoped with --filter @vaz/web ---
[tasks.dev]
run = "pnpm --filter @vaz/web exec next dev --port ${PORT:-3000}"
description = "Start web dev server (Turbopack, apps/web)"

[tasks.build]
# NODE_ENV=production is explicit (not inherited from the shell): a non-standard
# NODE_ENV during `next build` fails to prerender the framework's own
# `/_global-error` page (see apps/web/src/app/global-error.tsx NOTE).
run = "NODE_ENV=production pnpm --filter @vaz/web exec next build"
description = "Build web app for production (apps/web)"

[tasks.start]
run = "pnpm --filter @vaz/web exec next start --port ${PORT:-3000}"
description = "Serve web production build (apps/web)"

# --- Unit tests: root Vitest projects aggregate the whole workspace ---
[tasks.test]
run = "pnpm exec vitest"
description = "Run unit tests (watch mode)"

[tasks."test:run"]
run = "pnpm exec vitest run"
description = "Run unit tests once (all workspace projects)"

[tasks."test:coverage"]
run = "pnpm exec vitest run --coverage"
description = "Run unit tests with coverage"

# --- Client bundle budget (limits in .size-limit.json; brotli) ---
# Reads apps/web/.next, so it needs `mise run build` first. Not part of `check`
# (which never builds); CI runs it in tests.yml's `bundle-size` job.
[tasks.size]
run = "pnpm exec size-limit"
description = "Check apps/web client bundle size against .size-limit.json (requires build)"

# --- E2E: uses the root playwright.config.ts (webServer is scoped with --filter) ---
[tasks."test:e2e"]
run = "pnpm exec playwright test"
description = "Run E2E tests"

[tasks."test:e2e:ollama"]
run = "AI_PROVIDER=ollama pnpm exec playwright test"
description = "Run E2E tests against local Ollama (includes real chat round-trip)"

# --- Lint / format: biome scans the whole repository (apps/*, packages/*) ---
[tasks.lint]
run = "pnpm exec biome check ."
description = "Lint and format check (whole workspace)"

[tasks."lint:fix"]
run = "pnpm exec biome check --write ."
description = "Auto-fix lint and format issues"

# Hardcoded-model-ID detection gate (R1.8).
[tasks."lint:model-ids"]
run = "bash scripts/forbid-model-ids.sh"
description = "Fail if an LLM model ID is hardcoded outside @vaz/config (R1.8)"

# --- Type check: each workspace member runs its own tsc via pnpm -r ---
[tasks.typecheck]
run = "pnpm -r run typecheck"
description = "Type check across the workspace"

[tasks.audit]
run = "pnpm audit --audit-level=moderate"
description = "Dependency vulnerability audit (moderate+)"

# --- DB baseline provisioning: apply packages/db/drizzle/*.sql to DATABASE_URL ---
[tasks."db:migrate"]
run = "pnpm --filter @vaz/db run migrate"
description = "Apply packages/db/drizzle/*.sql to DATABASE_URL in lexical order (idempotent, R2.3)"

# --- Aggregate gate: git clone → pnpm install → mise run check stays green (NFR-2) ---
# Pre-commit equivalent (biome + tsc + vitest + audit) plus the model-id gate.
[tasks.check]
depends = ["lint", "typecheck", "test:run", "audit", "lint:model-ids"]
description = "Aggregate quality gate (clone → install → mise run check)"

# --- Python sidecar (services/agent) quality gate ---
# Deliberately NOT a dependency of `check`: the TS gate must stay green with no
# Python toolchain installed (NFR-1, Phase B independently landable).
[tasks."py:check"]
run = [
	"uv sync",
	"uv run ruff check .",
	"uv run pyright",
	"uv run pytest",
	# Supply-chain leg (spec 002 NFR-5). Delegated to `py:audit` rather than
	# inlined so the ignore list below has exactly one home. Last in the list so
	# a dependency advisory never masks a real ruff/pyright/pytest failure.
	"mise run py:audit",
]
dir = "services/agent"
description = "Python sidecar quality gate (uv sync + ruff + pyright + pytest + pip-audit); independent of `check` (NFR-1)"

# Python counterpart to `mise run audit`'s `pnpm audit` (spec 002 NFR-5).
# pip-audit was declared in [dependency-groups] dev from the start but never
# wired into a run path, so Python advisories went undetected everywhere. It is
# a task of its own — not an inline step of `py:check` — because two callers
# need it and neither should carry its own copy of the ignore list:
#   - `py:check` (and via it .github/workflows/python.yml), which is path-filtered
#     to services/agent and so only fires on changes there;
#   - .github/workflows/security-daily.yml, which catches advisories that land
#     against an unchanged lockfile — the case that broke the TS side on 2026-09-09.
#
# --ignore-vuln entries follow docs/dependency-policy.md §3 tier #4 (no fix
# version exists) and §6's retirement-condition discipline. Each needs (a) what
# the advisory is, (b) why it is excluded, (c) a re-evaluation deadline.
#
# PYSEC-2026-3740 (GHSA-8mgp-746c-j5xp / CVE-2026-81726): nltk's model-artifact
#   APIs (TransitionParser.train/parse, AveragedPerceptron.save/load,
#   PerceptronTagger.save_to_json, save_maxent_params) call built-in open() on
#   caller-supplied paths instead of the pathsec-aware helpers, so a caller that
#   relies on `pathsec` for containment can read/write outside the allowed roots.
# 除外理由: 修正版が存在しない — 上流は "Patched versions: Not yet patched" と明記し、
#   PyPI 最新の 3.10.3 が該当版そのもの。経路は llama-index-core → nltk の推移的依存で、
#   sidecar は nltk も pathsec も import しておらず (`grep -rn nltk app/ tests/` が空)、
#   llama-index-core 側の nltk 利用も punkt tokenizer のみ。脆弱な 4 API はこの venv の
#   どこからも参照されておらず、攻撃前提 (pathsec.ENFORCE=True かつ untrusted な
#   model path) はサイドカーの stateless 設計では成立しない。
# 再評価期限: 2026-12-11 — この日までに nltk の修正版公開を再確認し、出ていれば
#   `uv lock --upgrade-package nltk` で取り込んでこのエントリを撤去する。
#
# `uv run --frozen` is the counterpart of `pnpm install --frozen-lockfile`: audit
# the committed uv.lock rather than whatever resolves fresh today. `py:check` has
# already run `uv sync` by the time it reaches here; the security-daily job calls
# this task cold, and --frozen makes that path materialise the env from the lock
# without silently re-resolving it.
[tasks."py:audit"]
run = "uv run --frozen pip-audit --ignore-vuln PYSEC-2026-3740"
dir = "services/agent"
description = "Python dependency vulnerability audit (pip-audit; NFR-5 counterpart of `audit`)"

# --- Secret scanning (constitution §フック負荷配分; closes spec 006 Task 6's gap) ---
# Always `gitleaks git`, never `gitleaks dir`: `dir` walks the filesystem and so reads
# node_modules/, .venv/ and apps/web/.next/ (456 MB, and third-party findings this repo
# cannot act on), while `git` reads tracked git content only (9.93 MB). Confirmed by
# running both on 2026-09-22 — `dir` reported 265 findings including apps/web/.next/cache
# build artefacts, `git` reported 242, all of them classifiable.
#
# `--redact` on every scan that writes to a log a human does not control: gitleaks prints
# the matched value by default, so an unredacted CI run turns a true positive into a
# second disclosure in the build log. `secret-scan:report` is the deliberate exception —
# it writes to a local file precisely so the values can be classified.
#
# `.gitleaksignore` (repo root, read automatically) carries the baseline of confirmed
# false positives and the procedure for extending it.
[tasks."secret-scan"]
run = "gitleaks git --no-banner --redact ."
description = "Scan full git history for secrets (gitleaks; baseline in .gitleaksignore)"

# Pre-commit leg: scans the staged diff only, so it stays fast enough for every commit.
[tasks."secret-scan:staged"]
run = "gitleaks git --staged --no-banner --redact ."
description = "Scan staged changes for secrets (pre-commit leg of `secret-scan`)"

# Baseline regeneration input — deliberately NOT redacted, so findings can be classified
# before any fingerprint is added to .gitleaksignore. Writes outside the repo so a report
# full of matched values can never be committed by accident.
[tasks."secret-scan:report"]
run = "gitleaks git --no-banner --report-format json --report-path /tmp/gitleaks-report.json --exit-code 0 ."
description = "Write a full gitleaks JSON report to /tmp for .gitleaksignore regeneration"

# --- Python API lane (services/api) — second independent Python lane ---
# fastapi-pydantic-ai-agent imported whole via `git subtree add --prefix=services/api`
# (spec 006-repo-consolidation Task 6, ADR-0003). Mirrors services/agent's pattern:
# own pyproject.toml/uv.lock, no root uv workspace, `dir`-scoped tasks here rather than
# a nested mise.toml (the source repo's own mise.toml defined bare task names — `lint`,
# `test`, `dev`, `build`, `audit` — that collide with this repo's TS-side tasks of the
# same name; a nested mise.toml would also fight this file for config resolution when
# `mise run` is invoked from inside services/api). Every task below is `api:`-prefixed
# and `dir`-scoped instead. `services/api/mise.toml` itself was removed as part of the
# import — this block is its sole surviving form.
[tasks."api:dev"]
dir = "services/api"
description = "Start FastAPI development server with hot reload"
run = "uv run uvicorn app.main:app --reload --port 8000"

[tasks."api:test"]
dir = "services/api"
description = "Run all tests with coverage"
run = "uv run pytest tests/ -v --cov=app --cov-report=term-missing"

[tasks."api:test:unit"]
dir = "services/api"
description = "Run unit tests only (fast, no LLM calls)"
run = "uv run pytest tests/unit/ -v"

[tasks."api:test:integration"]
dir = "services/api"
description = "Run integration tests (real stores, FunctionModel LLM)"
run = "uv run pytest tests/integration/ -v"

[tasks."api:test:e2e"]
dir = "services/api"
description = "Run E2E tests (full HTTP stack)"
run = "uv run pytest tests/e2e/ -v"

[tasks."api:test:benchmark"]
dir = "services/api"
description = "Run performance benchmark tests (latency, throughput, cache hit rate)"
run = "uv run pytest tests/benchmarks/ -v -s"

[tasks."api:test:local"]
dir = "services/api"
description = "Run local tests (requires running Ollama instance)"
run = "uv run pytest tests/local/ -v -m ollama"

[tasks."api:test:redis"]
dir = "services/api"
description = "Run the Redis session store live lane (requires a reachable Redis server)"
run = "uv run pytest -m redis -v"

[tasks."api:test:ci"]
dir = "services/api"
description = "PR CI test stage: unit+integration+e2e with coverage gate (TestModel/FunctionModel only, no live LLM/Ollama)"
run = "uv run pytest tests/unit/ tests/integration/ tests/e2e/ -v --cov=app --cov-report=term-missing"

[tasks."api:audit"]
dir = "services/api"
description = "Run pip-audit to fail on non-ignored dependency vulnerabilities"
# Ignored IDs fall into three groups.
#
# Group 1 - all on `starlette`, held below 1.0 (pyproject.toml) because
# `slowapi` 0.1.10 is incompatible with starlette 1.x (see tasks.md Task 20.3).
# Assessed in .sdd/specs/001-agent-architecture-enhancements/tasks.md Task 20.3:
#   PYSEC-2026-161 - reachable (Host header into redirect Location), but
#     mitigated at the app layer by TrustedHostMiddleware (app/main.py, Task
#     20.1) regardless of the starlette version installed.
#   PYSEC-2026-248 - unreachable: no `HTTPEndpoint` usage in this codebase.
#   PYSEC-2026-249 - unreachable: no `request.form()` call; `python-multipart`
#     isn't even installed (plain `fastapi`, not `fastapi[standard]`).
#   PYSEC-2026-2280 - unreachable: no `HTTPEndpoint` usage.
#   PYSEC-2026-2281 - unreachable: no `StaticFiles` usage; Windows-only UNC
#     path issue besides.
# Re-run `uv run pip-audit` (without --ignore-vuln) after any starlette bump
# to confirm these still apply before renewing the ignore list.
#
# Group 2 - all on `chromadb` 0.6.3 (held below 1.0, pyproject.toml, as a
# shelved major pending a client-compatibility pass - see
# docs/dependency-runbook.md). Unlike the starlette group, these have no fix
# release to upgrade into: PyPI/OSV list `fixed_in: []` for all three, and the
# affected range ("0.4.17 or later" / "0.5.0 or later") covers even the
# latest chromadb (still 1.5.9, re-checked 2026-09-22) - so lifting the `<1.0` cap would
# not close them either.
#   CVE-2026-45830 (GHSA-2wm9-hf6c-p5cr, PYSEC-2026-3813) - a lack of
#     authorization validation lets any authenticated user read/write/update/
#     delete another tenant's collection.
#   CVE-2026-45831 (GHSA-xph7-9rjv-w5fr, PYSEC-2026-3815) -
#     `SimpleRBACAuthorizationProvider` checks whether a permission is held but
#     never which tenant/database/collection it applies to.
#   CVE-2026-45833 (GHSA-36p7-vc44-83pf, PYSEC-2026-3814) - an authenticated
#     attacker with UPDATE_COLLECTION can achieve remote code execution via a
#     malicious model repo plus `trust_remote_code=true` on the collections API.
# The PYSEC IDs were assigned after this group was written, and as of the
# 2026-09-22 refresh raw `pip-audit` prints *those* as the primary IDs rather
# than the CVEs listed in `--ignore-vuln` below. The entries still match,
# because pip-audit resolves `--ignore-vuln` against a vulnerability's aliases
# as well as its primary ID (verified: raw output reports 14 findings, the
# ignore list suppresses all 14). Do not "fix" the apparent mismatch by
# swapping the CVE ids out - keeping the CVE form is what makes this group
# readable next to the GHSA links.
# All three require ChromaDB's server (multi-tenant HTTP API, RBAC,
# `trust_remote_code`). This codebase never runs a Chroma server: `app/stores/
# vector_store/chroma.py` only ever constructs `chromadb.PersistentClient` or
# `chromadb.Client()` (the embedded, in-process client) - no `HttpClient`, no
# tenants, no RBAC config. Unreachable today.
# These are NOT dormant like the starlette entries above: the moment
# `ChromaVectorStore` (or any new code) switches to `chromadb.HttpClient` or
# this app starts talking to a standalone Chroma server process - see the
# example in docs/production_deployment.md - all three become reachable and
# this ignore list must be revisited before that ships. Re-run `uv run
# pip-audit` (without --ignore-vuln) after any chromadb bump to check whether
# upstream has since shipped a fix.
#
# Group 3 - `nltk` 3.10.3, a transitive of `llama-index-core` (nothing in
# `app/`, `evals/`, or `tests/` imports nltk directly). First seen in the
# 2026-09-05 dependency refresh.
#   PYSEC-2026-3740 (GHSA-8mgp-746c-j5xp / CVE-2026-81726) - model-artifact
#     import/export helpers call built-in `open()` on caller-controlled paths
#     instead of the pathsec-aware helpers, so they read and write outside the
#     allowed roots when NLTK path-security enforcement is on.
# Like Group 2 this has no fix release: `fixed_in: []`, and 3.10.3 is the
# latest nltk on PyPI (re-checked 2026-09-22), so no bump closes it. Unreachable
# here on two independent counts: (1) the advisory's own preconditions require
# the application to enable `pathsec.ENFORCE` AND let untrusted input choose a
# model import/export path - this codebase does neither; (2) none of the
# affected components (`TransitionParser`, `AveragedPerceptron`,
# `PerceptronTagger.save_to_json`, `save_maxent_params`) is reachable - the
# only llama-index-core module that touches nltk is
# `indices/keyword_table/utils.py` (stopword lookup), and this codebase never
# builds a keyword-table index; the RAG path is `app/workflows/corrective_rag.py`
# over the `VectorStore` protocol. Re-run `uv run pip-audit` (without
# --ignore-vuln) after any llama-index-core bump to check for an nltk fix
# release, and revisit this entry if any code starts calling nltk's model
# serialization APIs.
#
# `uv run --frozen` for the same reason `py:audit` uses it: audit the committed
# uv.lock rather than whatever resolves fresh today. `api:check` has already run
# `uv sync` by the time it reaches here, so --frozen is a no-op on that path; the
# security-daily job calls this task cold, and --frozen is what makes that path
# materialise the env from the lock instead of silently re-resolving it.
run = "uv run --frozen pip-audit --ignore-vuln PYSEC-2026-161 --ignore-vuln PYSEC-2026-248 --ignore-vuln PYSEC-2026-249 --ignore-vuln PYSEC-2026-2280 --ignore-vuln PYSEC-2026-2281 --ignore-vuln CVE-2026-45830 --ignore-vuln CVE-2026-45831 --ignore-vuln CVE-2026-45833 --ignore-vuln PYSEC-2026-3740"

[tasks."api:hooks:install"]
dir = "services/api"
description = "Install the pre-commit git hook (gitleaks/pip-audit/model-id/tool-conventions guards, Req 12.4)"
run = "uv run pre-commit install"

[tasks."api:evals"]
dir = "services/api"
description = "Run the offline evals suite against the golden dataset (Req 6.5); pre-push only, never on GitHub Actions"
run = "uv run python -m evals.runner"

[tasks."api:evals:pr-gate"]
dir = "services/api"
description = "Compare two evals runs' EvalReport JSON files for regressions (X-8); offline, no LLM calls, not wired into CI"
run = "uv run python -m evals.pr_gate"

[tasks."api:lint"]
dir = "services/api"
description = "Run ruff linter and ty type checker"
run = ["uv run ruff check app/ evals/ tests/", "uv run ty check app/ evals/"]

[tasks."api:format"]
dir = "services/api"
description = "Run ruff formatter"
run = "uv run ruff format app/ evals/ tests/"

[tasks."api:build"]
dir = "services/api"
description = "Build Docker image"
run = "docker build -t fastapi-pydantic-ai-agent:latest ."

# --- Python sidecar (services/api) aggregate quality gate ---
# Deliberately NOT a dependency of `check`: the TS gate must stay green with no
# Python toolchain installed (NFR-1, mirrors `py:check`'s independence).
# Mirrors what `services/api`'s own CI runs (see its CLAUDE.md "Gating: what
# runs where"): lint -> test:ci (unit+integration+e2e+coverage) -> audit. The
# `test:redis` lane is deliberately excluded from this aggregate — it needs a
# live Redis server and self-skips (never fails) when none is reachable, so
# running it here would either silently no-op or require local infra; it stays
# a standalone `mise run api:test:redis` for when a server is available, and CI
# runs it via its own workflow step with a real service container.
[tasks."api:check"]
run = [
	"uv sync",
	"uv run ruff check app/ evals/ tests/",
	"uv run ty check app/ evals/",
	"uv run pytest tests/unit/ tests/integration/ tests/e2e/ -v --cov=app --cov-report=term-missing",
	# Supply-chain leg, delegated to `api:audit` for the same reason `py:check`
	# delegates to `py:audit`: one home for the ignore list. Last in the list so
	# a dependency advisory never masks a real ruff/ty/pytest failure.
	"mise run api:audit",
]
dir = "services/api"
description = "Python API lane quality gate (uv sync + ruff + ty + pytest[unit+integration+e2e] + pip-audit); independent of `check` (NFR-1)"

# --- Boundary contract codegen (Req 3.5): FastAPI OpenAPI -> openapi-typescript ---
# Regenerates the committed snapshot + generated TS types from services/agent's live
# Pydantic models (source of truth for the new HTTP boundary, ADR-B). Not build-ified
# (source-only package rule, no build step) — rerun manually/in CI when the boundary changes.
[tasks."openapi:gen"]
run = """
set -e
mkdir -p packages/schemas/src/generated
cd services/agent && uv run python -c "import json; from app.main import app; print(json.dumps(app.openapi(), indent=2))" > ../../packages/schemas/src/generated/openapi.snapshot.json
cd ../.. && pnpm exec openapi-typescript packages/schemas/src/generated/openapi.snapshot.json -o packages/schemas/src/generated/agent-service.ts
"""
description = "Regenerate generated/agent-service.ts + openapi.snapshot.json from services/agent's OpenAPI schema (Req 3.5)"
