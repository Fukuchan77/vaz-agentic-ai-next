name: api

# Python API lane quality gate (services/api, spec 006-repo-consolidation Task
# 6, ADR-0003): uv sync + ruff + ty + pytest(unit/integration/e2e, coverage
# gate) + pip-audit, then the Redis session-store live lane against a real
# service container. Path-filtered — runs only when this lane (or this
# pipeline's own inputs) changes, mirroring `api:check`'s stance of being
# deliberately outside `mise run check` (NFR-1: TS gates stay green without a
# Python toolchain) and python.yml's identical stance for services/agent.
# NOT part of tests.yml's `gate` aggregation: a path-filtered job is absent on
# most pushes, which would break the `needs` + `if: always()` required check.
on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "mise.toml"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "services/api/**"
      - "mise.toml"
      - ".github/workflows/api.yml"

# Auto-cancel stale runs when new pushes land on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default (X-1): this job only checks out and reads the repo.
permissions:
  contents: read

jobs:
  api-check:
    runs-on: ubuntu-latest
    # Ported source's own run 31862477318 hung on an unbounded asyncio wait in
    # the test suite and burned 5h59m before the default 360-minute limit
    # killed it, losing pytest's failure summary along with it (the kill
    # arrives as a cancellation). Keep the same 30-minute cap here.
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Provisions node/pnpm/uv from mise.toml [tools]; api:check needs uv
      # only, but the shared action keeps provisioning identical to the other
      # workflows.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: Python API Lane Quality Gate (lint + test + audit)
        run: mise run api:check

      - name: Redis session store live lane
        env:
          EXPECT_LIVE_TESTS: "7"
        run: mise run api:test:redis
