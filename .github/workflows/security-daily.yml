name: security-daily

# The repo's only scheduled workflow: supply-chain checks that are time-sensitive in
# a way the push/PR gates are not. A dependency audit across all three dependency
# lanes (pnpm workspace, services/agent, services/api), plus a full-history secret
# scan — and nothing else. Both belong on a clock because both can go from green to
# red with no commit at all: a new advisory lands against an unchanged lockfile, and
# a new gitleaks detection rule matches history that was already there. Everything
# else (lint, typecheck, unit tests, E2E, evals) is triggered by an actual change or
# by hand. The eval workflows used to hold the nightly slot; they are
# manual/label-gated now (see eval-nightly.yml, eval-pr.yml) because they call real
# models on every firing.
#
# Four jobs — one per dependency lane, plus `secret-scan` — deliberately independent
# (same reason tests.yml splits `unit` from `audit`): a failure in one must not hide
# the others' results. Both Python legs exist because python.yml / api.yml are
# path-filtered to services/agent and services/api respectively — on their own they
# would only ever fire on a PR that touches that lane, and never on the case this
# workflow is built for. Every lane that has an audit task belongs here, and
# tests/repo/ci-workflows.spec.ts guards that: a lane going missing from this file
# is silent — no failure, just no coverage.
on:
  schedule:
    # 17:00 UTC = 02:00 JST. Inherited from the previous nightly-eval slot.
    - cron: "0 17 * * *"
  workflow_dispatch: {}

# A manual dispatch racing the schedule should not run twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default (X-1): these jobs only check out and read the repo.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # --frozen-lockfile so the audit reflects the committed dependency graph
      # rather than whatever resolves fresh today.
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Same gate as the `audit` job in tests.yml; see docs/dependency-policy.md
      # for the detection → triage → response runbook when this fails.
      - name: Security Audit
        run: pnpm audit --audit-level=moderate

  py-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Provisions uv from mise.toml [tools]; no pnpm/action-setup here, the
      # Python leg needs nothing from the npm side.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      # `py:audit` (mise.toml) is the single home for the pip-audit invocation
      # and its --ignore-vuln list, shared with `py:check`. It runs
      # `uv run --frozen`, the uv counterpart of `pnpm install --frozen-lockfile`
      # above: audit the committed uv.lock, not whatever resolves fresh today.
      - name: Python Security Audit
        run: mise run py:audit

  # Third lane, same rationale as `py-audit` above applied to the second Python
  # stack: api.yml is path-filtered to `services/api/**`, so on its own it only
  # ever fires on a PR that touches that lane — never on the case this workflow
  # exists for (a new advisory landing against an unchanged services/api/uv.lock).
  # Without this job the lane carrying the largest --ignore-vuln list in the repo
  # (9 entries suppressing 14 findings across starlette/chromadb/nltk, all of them
  # "no fix release exists" exclusions whose reachability arguments are only valid
  # until upstream changes) had no standing detection net at all.
  api-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Provisions uv from mise.toml [tools]; no pnpm/action-setup here, the
      # Python leg needs nothing from the npm side.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      # `api:audit` (mise.toml) is the single home for this lane's pip-audit
      # invocation and its --ignore-vuln list, shared with `api:check`. Like
      # `py:audit` it runs `uv run --frozen`, so this cold path audits the
      # committed services/api/uv.lock rather than a fresh re-resolution.
      - name: Python API Lane Security Audit
        run: mise run api:audit

  # Fourth job: secret scanning. Independent of the three audit jobs for the same
  # reason they are independent of each other — and this repo has direct evidence
  # for it. The source repo of `services/api` ran `pip-audit` and gitleaks as
  # sequential STEPS of one job, so a red `pip-audit` meant gitleaks never ran; that
  # hid 365 findings for months (services/api/AGENTS.md records it). A separate job
  # cannot be masked that way.
  #
  # This closes spec 006 Task 6's known gap: `services/api` was imported with its
  # gitleaks wiring left behind, so until 2026-09-22 this repo had no secret scanning
  # anywhere — not in CI, not in .githooks/pre-commit (which runs
  # biome/tsc/vitest/audit/model-ids only).
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # fetch-depth: 0 is load-bearing, not tidiness. `secret-scan` runs
      # `gitleaks git`, which scans commits; checkout's default depth of 1 would
      # scan exactly one of them and pass. It is also what makes the
      # `.gitleaksignore` baseline resolvable at all — every entry is keyed by
      # `<commit>:<file>:<rule>:<line>`, so the commits have to be present.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Provisions gitleaks from mise.toml [tools]; no pnpm/action-setup here.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      # `secret-scan` (mise.toml) is the single home for the gitleaks invocation and
      # its flags, shared with .githooks/pre-commit. It passes --redact, so a true
      # positive is reported as a location without republishing the value into a
      # build log that outlives the incident.
      - name: Secret Scan
        run: mise run secret-scan
