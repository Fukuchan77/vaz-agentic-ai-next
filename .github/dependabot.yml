version: 2

# X-15: `security-daily.yml` only *detects* vulnerable versions against the
# committed lockfiles (`pnpm audit`) — it never proposes an update. Dependabot
# fills that gap: version-bump PRs for the pnpm workspace, the Python sidecar
# (services/agent, uv-managed), and this directory's own GitHub Actions
# pins (X-1 SHA-pins them; Dependabot still finds and bumps a pinned SHA,
# same as it would a tag).
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # docs/dependency-policy.md §7: a bot must not propose a version newer than
    # `minimumReleaseAge: 1440` (24h) in pnpm-workspace.yaml allows. Without this,
    # Dependabot opens PRs for versions pnpm will then refuse to resolve — the
    # policy and the bot disagreeing in public. 1 day is the exact mirror of 1440
    # minutes; raise both together or neither.
    cooldown:
      default-days: 1
    # `ai` and every `@ai-sdk/*` package share one internal dependency,
    # `@ai-sdk/provider-utils` -- pinned to a single resolved version across
    # the workspace by pnpm's single-lockfile resolution. Left ungrouped,
    # Dependabot opens one PR per package (#30-#33, #39 all landed the same
    # week), each bumping only its own importer's `@ai-sdk/provider-utils`
    # entry -- so pnpm installs two versions side by side until every PR in
    # the set merges. `@vaz/evals`'s standalone typecheck (no per-package
    # tsconfig; see AGENTS.md) surfaces that split immediately as a real
    # type error (`Two different types with this name exist, but they are
    # unrelated`), which is why #31 and #33 had `lint: failure` while #30
    # and #32 happened to land green first. One group PR resolves
    # `@ai-sdk/provider-utils` once, consistently, the way `pnpm install`
    # would if a human bumped all five by hand in one change.
    groups:
      ai-sdk:
        patterns:
          - "ai"
          - "@ai-sdk/*"
    # The 3 majors AGENTS.md/CLAUDE.md record as deliberately held back — each
    # is a decision (see the "Three majors are deliberately held back" bullet
    # there), not a stale range Dependabot should try to close.
    ignore:
      # Vitest 5 resets mock state between tests by default, which breaks
      # apps/web/tests/auth.spec.ts's cross-test `NextAuthMock.mock.calls`
      # read. Adopting it needs `clearMocks: false` or a spec rewrite —
      # neither belongs in an automated bump.
      - dependency-name: "vitest"
        versions: [">=5"]
      - dependency-name: "@vitest/coverage-v8"
        versions: [">=5"]
      # TypeScript 7.0 is the native port; adopting it is an ADR-level
      # decision, not a range refresh.
      - dependency-name: "typescript"
        versions: [">=7"]
      # @types/node tracks the Node major mise.toml pins (24 LTS); bump it in
      # the same change that moves the runtime, never before.
      - dependency-name: "@types/node"
        versions: [">=25"]

  - package-ecosystem: "uv"
    directory: "/services/agent"
    schedule:
      interval: "weekly"
    # Same 24h publish-window rationale as the npm block above. pnpm's
    # `minimumReleaseAge` has no uv equivalent to mirror, so here the cooldown is
    # the only thing keeping the sidecar off freshly-published versions.
    cooldown:
      default-days: 1

  # services/api's own lane (spec 006-repo-consolidation Task 6, ADR-0003):
  # ignore list ported verbatim from the source repo's dependabot.yml, since
  # the load-bearing pins it guards (pyproject.toml's `fastapi<0.137` /
  # `starlette<1.0`) are unchanged by the move.
  - package-ecosystem: "uv"
    directory: "/services/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # fastapi<0.137 and starlette<1.0 are load-bearing pins (see the
      # dependency-pin comments in pyproject.toml and services/api/CLAUDE.md):
      # the newer versions of each silently disable the global rate limit.
      #
      # Both use explicit `versions:` ranges rather than `update-types`
      # classification. `update-types` failed silently for starlette: PR #36
      # proposed 0.52.1 -> 1.3.1 -- crossing the 0.x/1.x boundary -- despite
      # the `update-types: ["version-update:semver-major"]` entry this
      # replaced, and was closed by hand instead of by the bot. fastapi's
      # own 0.x releases bump by patch-position, so `update-types: minor`
      # doesn't reliably catch 0.136 -> 0.137 either -- the same
      # classification gap in the opposite direction. An explicit version
      # bound has no classification step to misfire: anything the guarded
      # number excludes just never turns into a PR.
      - dependency-name: "starlette"
        versions: [">=1.0"]
      - dependency-name: "fastapi"
        versions: [">=0.137"]
      # chromadb and redis majors are deliberately shelved pending a
      # client-compatibility verification pass, not unsupported. See
      # services/api/docs/dependency-runbook.md.
      #
      # chromadb is still shelved at 0.6.3: its three open advisories have no
      # fix release (`fixed_in: []` on all three) and the affected range covers
      # even the latest 1.5.9, so the major buys nothing security-wise, and the
      # pass has not been run.
      #
      # redis has had its pass: 2026-09-05, client bumped 5.3.1 -> 8.1.0 in
      # pyproject.toml after the live `-m redis` lane (EXPECT_LIVE_TESTS=7) and
      # the full unit+integration+e2e suite both came back green. This entry
      # stays because its meaning is forward-looking -- it now shelves redis 9.x
      # until that major gets its own pass, exactly as it shelved 6.x-8.x until
      # this one. `pyproject.toml`'s `redis<9.0` cap is the hard stop; this entry
      # keeps Dependabot from proposing the bump that would need it lifted.
      - dependency-name: "chromadb"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Deliberately no `cooldown` here: the option's per-ecosystem coverage could
    # not be confirmed against GitHub's docs from this environment, and an
    # `ignore`-style misconfiguration in a bot config fails silently (no PRs at
    # all) rather than loudly. The npm/uv blocks are where the documented policy
    # actually binds — `minimumReleaseAge` governs package registries, not action
    # refs — and X-1's SHA pinning plus human review already gates this one.
    # Add it here once the ecosystem support is confirmed.
