[project]
name = "fastapi-pydantic-ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=0.6.3,<1.0",
    # Capped below 0.137 (bisected: 0.136.3 flattens, 0.137.2 does not) because
    # 0.137 wraps included routers in `_IncludedRouter` instead of flattening them
    # into `app.routes`. slowapi's `_find_route_handler` scans `app.routes`
    # non-recursively for a `.endpoint` attribute, finds none, and `_should_exempt`
    # then treats every request as exempt - silently disabling the global rate
    # limit rather than failing loudly. Revisit when slowapi resolves routes
    # recursively; `tests/e2e/test_rate_limiting_enforcement.py` is the canary.
    "fastapi>=0.136.3,<0.137",
    "httpx>=0.28.1,<1.0",
    "llama-index-core>=0.14.24,<1.0",
    "llama-index-workflows>=2.24.0,<3.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0,<1.0",
    # Capped below its next minor, not its next major: this is a 0.x package
    # reaching into six private pydantic-ai APIs, so its minors are its
    # breaking releases. A `<1.0` bound would admit 0.3.x-0.9.x unreviewed --
    # the same 0.x classification trap the fastapi bound above closes.
    "pydantic-ai-litellm>=0.2.8,<0.3.0",
    # Bumped to the 2.x line only after the adapter-compatibility gate
    # (docs/adapter-probe-report-2026-08-13-run1.md) recorded a PASS across
    # all six stages. Capped below 3.0 so a future major can't reintroduce
    # v1-to-v2-style breaking changes without re-running that gate.
    #
    # The `openai` extra was dropped when bumping past 2.31.0: pydantic-ai-slim
    # 2.32.0 raised its `openai` extra's floor to `openai>=3.0.0`, which
    # conflicts with litellm (every release through at least 1.98.0 pins
    # `openai<3.0.0,>=2.20.0`) -- and this project always talks to models
    # through `pydantic-ai-litellm`/litellm, never pydantic-ai's native
    # OpenAI provider directly (see the LiteLLM-routing note below). Declaring
    # the extra forced the resolver to downgrade litellm and
    # pydantic-ai-litellm to satisfy the conflict instead of raising it.
    # Dropping the extra changes nothing installed: litellm's own
    # (non-extra) `openai`/`tiktoken` requirements already satisfy every
    # import pydantic_ai.models.openai needs (confirmed against uv.lock and
    # by `tests/unit/agents/test_build_model_public_api.py`, which imports
    # `OpenAIResponsesModel` directly). Re-add the extra only once litellm's
    # own openai floor reaches 3.0.
    "pydantic-ai-slim[logfire]>=2.46.0,<3.0",
    "pydantic-settings>=2.15.0,<3.0",
    # Bumped 5.3.1 -> 8.1.0 on 2026-09-05, retiring the "shelved major" status
    # that `.github/dependabot.yml` and docs/dependency-runbook.md recorded for
    # this package. The client-compatibility pass that shelving was waiting on
    # was actually run: against a live server, `EXPECT_LIVE_TESTS=7 uv run pytest
    # -m redis` passed all 7 cases (RedisSessionStore save/load/trim/TTL plus the
    # v1-wire-format serializer pin), and the full unit+integration+e2e suite came
    # back 1526 passed / 16 skipped at 96% coverage. Both consumers were exercised:
    # `RedisSessionStore` directly, and slowapi's `limits` storage indirectly (the
    # `redis` extra of `limits` is what the rate limiter uses when `redis_url` is
    # set). Capped below the next major, which is shelved in turn until its own
    # pass -- see the redis entry in `.github/dependabot.yml`.
    "redis>=8.1.0,<9.0",
    # Cap moved <6.0 -> <7.0 on 2026-09-21 (PR #37, 5.7.0 -> 6.1.0) after the
    # verification pass this package's cap was waiting on. Its only exercise is
    # chromadb's `SentenceTransformerEmbeddingFunction` (app/stores/vector_store/
    # chroma.py, model `all-MiniLM-L6-v2`), reached only by the `chroma`-marked
    # lane, which downloads the model from Hugging Face -- so the cap had stayed
    # in place for want of an environment that could run it, not for a known
    # incompatibility. Run for real from such an environment, the command being
    # `RUN_CHROMA_INTEGRATION_TESTS=1 EXPECT_LIVE_TESTS=6 uv run pytest` over
    # `tests/integration/test_chroma_query_with_scores.py`: it passed 6/6 against
    # a *fresh* `HF_HOME` (87 MB fetched over the wire, so a warm cache could not
    # have carried the run), and `mise run api:check` came back 1557 passed / 22
    # skipped at 96% coverage with ruff + ty clean and pip-audit finding nothing.
    #
    # 6.0's breaking changes do not reach this consumer: the multimodal
    # dict-input key-ordering change and the video-frame wrapper requirement both
    # apply to multimodal inputs, and this lane embeds plain text only.
    #
    # That same pass is what surfaced the `chromadb.types` filterwarnings entry
    # below -- the lane failed 6/6 on 5.7.0 *and* 6.1.0 before it, which is how
    # that blocker was established as pre-existing rather than caused by the bump.
    "sentence-transformers>=5.7.0,<7.0",
    "slowapi>=0.1.10,<1.0",
    # Pinned below 1.0 because slowapi 0.1.10 is not compatible with starlette 1.x:
    # exception-handler dispatch misroutes (a ValidationError reaches slowapi's
    # _rate_limit_exceeded_handler and dies on the missing .detail), and
    # SlowAPIMiddleware stops emitting X-RateLimit-* headers, silently disabling the
    # global rate limit. Revisit when slowapi supports starlette 1.x.
    #
    # The starlette advisories fixed only in 1.x are handled at the app layer
    # instead: the reachable one (Host header reflected into redirect Location) is
    # closed by TrustedHostMiddleware in main.py, and the rest are unreachable here
    # (no request.form(), no HTTPEndpoint, no StaticFiles).
    "starlette>=0.52.1,<1.0",
    "uvicorn[standard]>=0.53.0,<1.0",
]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1,<3",
    "pre-commit>=4.6.2,<5",
    "pytest>=9.1.1,<10.0",
    "pytest-asyncio>=1.4.0,<2.0",
    "pytest-cov>=7.1.0,<8.0",
    "ruff>=0.16.8,<1.0",
    "ty>=0.0.82,<0.1.0",
]

# ============================================================================
# Ruff Configuration - Linter & Formatter
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "D",    # pydocstyle (docstring)
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (Security)
    "ANN",  # flake8-annotations
    "RUF",  # Ruff-specific rules
    "T20",  # flake8-print
    "PT",   # flake8-pytest-style
    "SIM",  # flake8-simplify
]

ignore = [
    "D104", # Missing docstring in public package
]

[tool.ruff.lint.isort]
force-single-line = true
lines-after-imports = 2

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "ANN", "S603", "S607"]
"tests/benchmarks/**/*" = ["T201"]  # Allow print statements in benchmark tests

# ============================================================================
# Pytest Configuration
# ============================================================================
[tool.pytest.ini_options]
# Req 13.1/13.2: collect async tests without requiring an explicit
# @pytest.mark.asyncio, so an unmarked coroutine test cannot pass without
# being awaited.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "docker: marks tests that require Docker to be installed and available (skip in local dev, run in CI)",
    "benchmark: marks performance benchmark tests that measure latency, throughput, and cache hit rates",
    "ollama: requires running Ollama instance",
    "chroma: requires RUN_CHROMA_INTEGRATION_TESTS opt-in (downloads a Hugging Face embedding model)",
    "redis: requires a reachable Redis server",
]
# Req 7.1/7.2: turn "zero pydantic_ai deprecation warnings" from a
# measurement into an enforced invariant. Deliberately bare -- not keyed to
# `pydantic_ai`'s own module -- because pytest's filter `module` field
# matches the module a warning is *attributed to* (the caller, per
# `warnings.warn`'s `stacklevel`), not the module that calls `warnings.warn`;
# a `pydantic_ai`-keyed filter would never fire for a deprecated call
# attributed to first-party code (demonstrated in
# tests/unit/test_deprecation_filter.py). Applies to every pytest lane,
# since this is process-wide pytest config: unit, integration, e2e,
# benchmark, and the Ollama-gated local lane. `mise run evals` is out of
# scope by construction -- it invokes evals.runner directly, not pytest.
# Re-censused 2026-09-05 against pydantic-ai-slim 2.40.0, pydantic-ai-litellm
# 0.2.8, litellm 1.99.0, and anyio 4.15.0 (the dependency refresh that also
# retired the redis shelved major). Lanes actually run: unit, integration, e2e,
# benchmark, and the live `-m redis` lane -- 1526 passed / 16 skipped, plus 7
# benchmark and 7 redis cases. The Ollama-gated local lane was NOT run (no
# reachable Ollama in this environment) and self-skips per its own gating, so it
# is unverified this round rather than confirmed clean.
# This census found exactly ONE new emitter, and it is the first entry this
# ignore list has ever carried: anyio 4.15.0 deprecated the
# `anyio.abc.BlockingPortal` alias, and starlette 0.52.1's `testclient.py` still
# reads it at module import. The warning is attributed to `starlette.testclient`
# (anyio raises it with stacklevel=3), it fires at COLLECTION time for every
# module importing `TestClient`, and it errored out 29 unit modules before the
# entry below was added. It cannot be fixed by upgrading -- starlette dropped the
# alias in 1.x, which the `starlette<1.0` cap forbids. Nothing else regressed.
# Re-censused 2026-08-29 against pydantic-ai-slim 2.35.3, pydantic-ai-litellm
# 0.2.8, and litellm 1.98.0 (the dependency refresh that also fixed the
# Security Scan pip-audit failure -- see mise.toml's `audit` task): zero
# DeprecationWarning of any origin was observed across unit, integration,
# e2e, and benchmark. The Ollama-gated local lane was not run (no reachable
# Ollama instance in this environment) and self-skips per its own gating, so
# it is unverified this round rather than confirmed clean. No
# `ignore::DeprecationWarning:<module>` entries are needed.
# Re-censused 2026-08-14 against pydantic-ai-slim 2.30.0 and
# pydantic-ai-litellm 0.2.8 (the 2.x lock refreshed in task 7.4) across all
# five lanes above: zero DeprecationWarning of any origin was observed, so
# no `ignore::DeprecationWarning:<module>` entries are needed. Task 6's
# adapter-compatibility gate never triggered task 6.6's Class-B hatch (it
# recorded a PASS on its first graded run -- docs/adapter-probe-report-
# 2026-08-13-run1.md), so there was no inherited ignore entry to re-justify
# or remove here either. Original census taken 2026-08-11 against
# pydantic-ai-slim 1.107.2, also zero warnings. Re-census (and add ignore
# entries here as needed, each naming its emitter) on the next pydantic-ai
# constraint bump.
filterwarnings = [
    "error::DeprecationWarning",
    # Emitter: `starlette.testclient` (0.52.1). anyio 4.15.0 deprecated the
    # `anyio.abc.BlockingPortal` alias, and starlette's `testclient.py` still
    # reads it at module import to build `_PortalFactoryType`. The warning is
    # attributed (stacklevel=3) to `starlette.testclient`, not to anyio, so this
    # entry names the module the filter actually matches. It fires at COLLECTION
    # time for every module that imports `TestClient`, which is why the whole
    # unit lane errors out without it.
    #
    # Not fixable by upgrading: starlette moved off the alias in 1.x, and this
    # project is held at `starlette<1.0` because slowapi 0.1.10 is incompatible
    # with starlette 1.x (see the pin comment in [project].dependencies). Remove
    # this entry the moment that cap can be lifted -- it is scoped to the single
    # emitting module, so a deprecation raised anywhere else still hard-fails.
    "ignore::DeprecationWarning:starlette.testclient",
    # Emitter: `chromadb.types` (0.6.3). pydantic 2.11 deprecated reading
    # `model_fields` off an *instance*, and chromadb's `types.py` still does
    # exactly that in `get_model_fields()` (called from `Collection.__getitem__`).
    # The warning is `PydanticDeprecatedSince211`, a `DeprecationWarning`
    # subclass, and pydantic raises it with `stacklevel=2`, so it is attributed
    # to `chromadb.types` rather than to pydantic -- this entry names the module
    # the filter actually matches.
    #
    # Scope: only lanes that touch a real Chroma collection hit it. Every default
    # lane patches `SentenceTransformerEmbeddingFunction` and never reaches
    # `sysdb.create_collection`, which is why the entry was not needed until the
    # `chroma`-marked lane was run for real (added 2026-09-21 during the
    # sentence-transformers 6.1.0 verification pass, where it failed all 6 cases
    # on BOTH 5.7.0 and 6.1.0 -- a pre-existing blocker, not a bump regression).
    #
    # Not fixable by upgrading: chromadb 1.x is the shelved major (three
    # advisories with `fixed_in: []` at every version -- see `.github/dependabot.yml`),
    # and `chromadb<1.0` is the hard stop. Remove this entry when that cap lifts;
    # it is scoped to the single emitting module, so a deprecation raised anywhere
    # else still hard-fails.
    "ignore::DeprecationWarning:chromadb.types",
]

# ============================================================================
# Coverage Configuration - CI gate (Req 1.3: fail PR CI below 80% line coverage)
# ============================================================================
[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 80

# ============================================================================
# Ty (Type Checker) Configuration - Strict type checking
# ============================================================================
[tool.ty]

[tool.ty.analysis]
# Respect type: ignore comments in code
respect-type-ignore-comments = true
# Don't replace any imports with Any (empty list = strict mode)
replace-imports-with-any = []
